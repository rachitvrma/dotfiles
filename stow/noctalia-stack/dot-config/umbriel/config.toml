[include.optional]
files = ["noctalia.toml"]

[include]
files = [
  "animations.toml",
  "appearance.toml",
  "effects.toml",
  "events.toml",
  "general.toml",
  "hot_corners.toml",
  "input.toml",
  "keybinds.toml",
  "layer-rules.toml",
  "layout.toml",
  "outputs.toml",
  "window-rules.toml",
]

[overview]
zoom = 0.5

[workspaces]
back_and_forth = true
empty_above = true

[environment]
QT_QPA_PLATFORMTHEME = "qt6ct"
SDL_VIDEODRIVER = "wayland"
QT_QPA_PLATFORM = "wayland"
GDK_BACKEND = "wayland,x11"
GTK_USE_PORTAL = "1"
CLUTTER_BACKEND = "wayland"
MOZ_ENABLE_WAYLAND = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
WLR_RENDERER = "vulkan"
LIBVA_DRIVER_NAME = "iHD"
