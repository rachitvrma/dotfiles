[input]
middle_click_paste = false
client_window_drag = true
window_drag_toggle = "none"
# mod_right_double_click = "none"

[input.cursor]
follows_focus = true
hardware_cursor = true
hide_timeout_ms = 0
hide_when_typing = true
size = 24
theme = "Bibata-Modern-Ice"

[input.focus]
follows_mouse = true
hover_raises = false

[input.keyboard]
layout = "us"
numlock_toggle = true
options = "ctrl:swapcaps"
repeat_delay = 600
repeat_rate = 25
track_layout = "global"
variant = "colemak_dh"

[input.mouse]
scroll_wheel_step = 60
sensitivity = 0.0

[input.tablet]
enabled = true

[input.touchpad]
disable_while_typing = true
natural_scroll = true
tap = true
accel_profile = "adaptive"
