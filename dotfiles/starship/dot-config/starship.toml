"$schema" = "https://starship.rs/config-schema.json"
palette = "noctalia"

# Tartarus-style (AllJavi) prompt using only palette names that the generated
# Noctalia block defines: crust, text, overlay1, subtext0, mauve, yellow, red,
# green, blue, teal, sapphire, lavender, peach.
#
# HOW TO APPLY
#   - Replace your top-level `format = """..."""` with the one below.
#   - Replace the whole sections marked REPLACE.
#   - In sections marked KEEP SYMBOL, keep your existing `symbol = ...` line
#     and only swap the `style` and `format` lines.
#   - Add the sections marked NEW.
#   - Do NOT touch [os.symbols], [directory.substitutions], the other palettes,
#     or anything between "# >>> NOCTALIA STARSHIP PALETTE >>>" and
#     "# <<< NOCTALIA STARSHIP PALETTE <<<" (Noctalia rewrites that block).
#
# Powerline glyphs are written as \uXXXX escapes so they survive copy/paste:
#   \uE0B0 = right arrow, \uE0B2 = left arrow, \uF017 = clock, \uF023 = lock

format = """
[ ](bold bg:overlay1 fg:crust)\
$os\
$username\
$hostname\
[ ](bold bg:overlay1 fg:crust)\
[\uE0B0](bold bg:mauve fg:overlay1)\
$git_branch\
$git_commit\
$git_state\
$git_status\
[\uE0B0](bold bg:none fg:mauve) \
$docker_context\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$nix_shell\
$conda\
$cmd_duration\
$fill\
[\uE0B2](bold bg:none fg:text)\
$time\
[\uE0B2](bold bg:text fg:yellow)\
$battery\
[█](bold bg:none fg:yellow)
[バカ](bold bg:none fg:text) \
$directory\
$status\
$character
"""

# ---------------------------------------------------------------- REPLACE
[fill] # NEW
symbol = " "

[os] # REPLACE (keep [os.symbols] below it)
disabled = false
style = "bold bg:overlay1 fg:crust"

[username] # REPLACE
show_always = true
style_user = "bold bg:overlay1 fg:crust"
style_root = "bold bg:overlay1 fg:crust"
format = "[$user]($style)"

[hostname] # NEW
ssh_only = true
style = "bold bg:overlay1 fg:crust"
format = "[@$hostname]($style)"

[directory] # REPLACE (keep [directory.substitutions])
style = "bold bg:none fg:yellow"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " \uF023"
truncation_length = 3
truncation_symbol = "…/"

[git_branch] # KEEP SYMBOL, swap style + format
format = "[ $symbol $branch ]($style)"
style = "bold bg:mauve fg:crust"

[git_status] # REPLACE
style = "bold bg:mauve fg:crust"
format = "[($all_status$ahead_behind )]($style)"

[git_commit] # NEW
style = "bold bg:mauve fg:crust"
format = '[\($hash$tag\) ]($style)'

[git_state] # NEW
style = "bold bg:mauve fg:crust"
format = '[\($state( $progress_current/$progress_total)\) ]($style)'

# Language modules: KEEP SYMBOL, swap style + format on each.
# Generic format for all of them:  "[$symbol( $version) ]($style)"
# Per-module style:
#   [c]        style = "bold fg:blue"
#   [rust]     style = "bold fg:red"
#   [golang]   style = "bold fg:teal"
#   [nodejs]   style = "bold fg:green"
#   [bun]      style = "bold fg:peach"
#   [php]      style = "bold fg:lavender"
#   [java]     style = "bold fg:red"
#   [kotlin]   style = "bold fg:sapphire"
#   [haskell]  style = "bold fg:mauve"
# Python keeps its virtualenv part:
#   [python]   style = "bold fg:yellow"
#              format = '[$symbol( $version)(\(#$virtualenv\)) ]($style)'

[docker_context] # KEEP SYMBOL
style = "bold fg:blue"
format = "[$symbol( $context) ]($style)"

[conda] # KEEP SYMBOL and ignore_base
style = "bold fg:green"
format = "[$symbol$environment ]($style)"

[nix_shell] # NEW
symbol = "\uF313 "
style = "bold fg:sapphire"
format = "[$symbol$state( \\($name\\)) ]($style)"

[cmd_duration] # KEEP show_milliseconds / notification keys
format = "[\uF252 $duration ]($style)"
style = "bold fg:subtext0"

[time] # REPLACE
disabled = false
time_format = "%R"
style = "bold bg:text fg:crust"
format = "[ \uF017 $time ]($style)"

[battery] # NEW (laptop; remove $battery from format on a desktop)
full_symbol = "\uF240"
charging_symbol = "\uF0E7"
unknown_symbol = "\uF128"
discharging_symbol = "\uF244"
format = "[ $symbol $percentage]($style) "

[[battery.display]]
threshold = 10
discharging_symbol = "\uF244"
style = "bold bg:yellow fg:crust"

[[battery.display]]
threshold = 30
discharging_symbol = "\uF243"
style = "bold bg:yellow fg:crust"

[[battery.display]]
threshold = 50
discharging_symbol = "\uF242"
style = "bold bg:yellow fg:crust"

[[battery.display]]
threshold = 80
discharging_symbol = "\uF241"
style = "bold bg:yellow fg:crust"

[[battery.display]]
threshold = 100
discharging_symbol = "\uF240"
style = "bold bg:yellow fg:crust"

[status] # NEW
disabled = false
symbol = "✗"
format = "[$symbol$status]($style) "
style = "bold fg:red"

[line_break] # REPLACE (the format has a literal newline)
disabled = true

[character] # REPLACE
disabled = false
success_symbol = "[❯](bold fg:text)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:yellow)"
vimcmd_replace_one_symbol = "[❮](bold fg:mauve)"
vimcmd_replace_symbol = "[❮](bold fg:mauve)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"

# >>> NOCTALIA STARSHIP PALETTE >>>
