# Always pass pastes through app-text/ansifilter
# FIXME: Don't know why asks for Gentoo package app-text/ansifilter to be present, when I have
# already installed ansifilter from Guix
NOANSI=1

# Give raw links which can immediately be used for patches, etc
RAW=1

# Remember to extract token and add it to gists.conf in ~/.wgetpaste.d
DEFAULT_SERVICE="gists"
# Only share with those you share link with
PUBLIC_gists='false'
# This is what's added to ~/.wgetpaste.d/gists.conf
# Generate it using gh auth token
# HEADER_gists="Authorization: token XXXX" 


