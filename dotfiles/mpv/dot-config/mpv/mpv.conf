profile=gpu-hq
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vaapi
scale=ewa_lanczossharp
deband=yes
video-sync=display-resample
interpolation=yes
tscale=oversample
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
# uosc replaces the stock OSC
osc=no
osd-bar=no
border=no
save-position-on-quit=yes
input-ipc-server=/tmp/mpv.sock


