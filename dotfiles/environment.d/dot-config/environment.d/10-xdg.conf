# Variables for the systemd user manager, i.e. GUI sessions and services.
# Shells set the same values themselves (bashrc.d/00-xdg-envvars.bashrc,
# fish conf.d/00-xdg-envvar.fish). environment.d(5) expands ${VAR}.
XDG_CONFIG_HOME=${HOME}/.config
XDG_CACHE_HOME=${HOME}/.cache
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state
CARGO_HOME=${XDG_DATA_HOME}/cargo
