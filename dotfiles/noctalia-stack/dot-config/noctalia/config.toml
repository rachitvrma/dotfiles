[nightlight]
enabled = true

[notification]
background_opacity = 1.0
layer = "overlay"

[osd]
background_opacity = 1.0

[plugin_settings."thepunkoff/pomodoro"]
auto-start-breaks = true
auto-start-work = true
bypass-noctalia-sound-globals = true
enable-work-timer-sound = true
use-bundled-alarm-sound = true

[plugins]
enabled = [
  "noctalia/kaomoji",
  "noctalia/timer",
  "noctalia/umbriel-companion",
  "thepunkoff/pomodoro",
  "noctalia/wallhaven",
  "noctalia/bongocat",
]

[shell]
avatar_path = "/home/krish/Pictures/Avatars/shinchan.png"
font_family = "JetBrainsMono Nerd Font"
launch_apps_as_systemd_services = true
launch_apps_custom_command = "systemd-run --user"
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.panel]
polkit_placement = "attached"
transparency_mode = "glass"

[theme]
builtin = "Rose Pine"
community_palette = "Gruvbox Material Hard"
custom_palette = "Gruvbox Material Hard"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = [
  "btop",
  "cava",
  "emacs",
  "gtk3",
  "gtk4",
  "kitty",
  "qt",
  "starship",
  "umbriel",
]
community_ids = [
  "qutebrowser",
  "discord",
  "libreoffice",
  "zathura",
  # "papirus-icons",
  "bat",
  "fzf",
  "starship",
  "pywalfox",
]

[theme.templates.user.cava]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/cava/cava.ini"
output_path = "$XDG_CONFIG_HOME/cava/themes/noctalia"
post_hook = "bash '{{ config_dir }}/templates/cava/apply.sh'"
# undo_hook = "bash '{{ config_dir }}/templates/cava/undo.sh'"

[wallpaper]
directory = "/home/krish/Pictures/Wallpapers"
transition_on_startup = true

[wallpaper.default]
path = "/home/krish/Pictures/Wallpapers/wallhaven-jevz8y_1920x1080.png"

[wallpaper.last]
path = "/home/krish/Pictures/Wallpapers/wallhaven-jevz8y_1920x1080.png"

[wallpaper.monitors.eDP-1]
path = "/home/krish/Pictures/Wallpapers/wallhaven-jevz8y_1920x1080.png"

[widget.audio_visualizer]
color_2 = "secondary"

[widget.bar]
type = "noctalia/timer:bar"

[widget.bar_2]
type = "noctalia/umbriel-companion:bar"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = false

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
color = "primary"
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
format = "{:%-I:%M:%S %p}"
tooltip_format = "{:%A}\\n{:%Y-%m-%d}"

[widget.cpu]
show_value = false

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.network_rx]
network_speed_compact = true
show_value = false

[widget.network_tx]
show_value = false

[widget.ram]
show_value = false

[widget.temp]
show_value = false

[widget.volume]
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
active_pill_size = 3.0
inactive_pill_size = 1.7000000000000002
pill_scale = 0.59999999999999998
show_labels = false
