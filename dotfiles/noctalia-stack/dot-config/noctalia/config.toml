[audio]
enable_sounds = true
sound_volume = 0.5

[bar.default]
background_opacity = 0.90
center = ["widget", "group:g1", "date"]
end = [
  "group:g7",
  "bar_2",
  "group:g5",
  "tray",
  "group:g6",
  "clipboard",
  "group:g2",
  "group:g3",
  "battery",
  "session",
]
font_family = "JetBrainsMono Nerd Font"
panel_overlap = 0
start = ["group:g4", "workspaces"]

[[bar.default.capsule_group]]
accordion = true
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g1"
members = ["clock", "bar"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = true
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g2"
members = ["network", "bluetooth"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = true
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g3"
members = ["volume", "brightness"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = true
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g4"
members = [
  "cat",
  "control-center",
  "caffeine",
  "nightlight",
  "launcher",
  "wallpaper",
  "wallhaven",
]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g5"
members = ["audio_visualizer", "media"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g6"
members = ["notifications"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border_width = 1.0
enabled = true
fill = "surface_container"
id = "g7"
members = ["ram", "temp", "cpu", "network_rx", "network_tx"]
opacity = 1.0
padding = 6.0

[battery]
warning_threshold = 30

[brightness]
enable_ddcutil = true
minimum_brightness = 0.10000000000000001
sync_all_monitors = true

[calendar]
enabled = true

[calendar.account.personal_google]
type = "google"

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget]

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.80
enabled = true
launcher_position = "end"
pinned = ["firefox", "kitty", "emacsclient", "pcmanfm", "equibop"]
reserve_space = false
show_dots = true
show_instance_count = false

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[keybinds]
cancel = ["Escape", "Ctrl+g"]
down = ["Down", "Ctrl+n"]
left = ["Left", "Ctrl+b"]
right = ["Right", "Ctrl+f"]
up = ["Up", "Ctrl+p"]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
  "lockscreen-login-box@eDP-1",
  "lockscreen-widget-0000000000000001",
  "lockscreen-widget-0000000000000002",
  "lockscreen-widget-0000000000000003",
  "lockscreen-widget-0000000000000004",
  "lockscreen-widget-0000000000000005",
]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 911.0
cy = 842.0
output = "HDMI-A-1"
placement_height = 1024.0
placement_width = 1821.0
rotation = 0.0
type = "login_box"

