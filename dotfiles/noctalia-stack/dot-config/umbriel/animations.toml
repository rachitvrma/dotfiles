[include]
files = [
  "/run/current-system/sw/share/umbriel/effects/animation/reveal/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/animation/squash/effect.toml",
  "/run/current-system/sw/share/umbriel/effects/animation/workspace_wipe/effect.toml",
]

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

# Optional live workspace reveal (see docs/user/animation.md).
# Add the bundled effects/animation/workspace_wipe/effect.toml to your includes.
[animation.workspaces]
style = "reveal"
enabled = true # Default: "slide"
effect = "workspace_wipe"
duration_ms = 300
curve = "easeout"

[animation.windows_in]
duration_ms = 300
curve = "easeout"
effect = "reveal"

[animation.windows_out]
duration_ms = 250
curve = "easeout"
effect = "reveal"

[animation.windows_move]
effect = "squash"

[animation.windows_drag]
physics = true


