# Generated by Home Manager.
# See https://sw.kovidgoyal.net/kitty/conf.html
font_family JetBrainsMono Nerd Font
font_size 12

# Shell integration is sourced and configured manually
shell_integration no-rc

allow_remote_control yes
background_opacity 1.000000
clipboard_control write-clipboard read-clipboard
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
custom_shaders inside-the-matrix
enable_audio_bell no
notify_on_cmd_finish unfocused
scrollback_lines 10000
tab_bar_style powerline
tab_powerline_style slanted
update_check_interval 0
window_padding_width 20

action_alias launch_tab launch --cwd=current --type=tab
action_alias launch_window launch --cwd=current --type=os-window

include /nix/store/5c52ax5gckcvp4zkggckd0h2ksv2qp24-base16-onedark.conf

